name: Stažení starého webu (jednorázově)
on:
  push:
    paths: ['.github/workflows/mirror.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Starý web je u Webglobe (DNS už míří jinam)
        run: echo "212.57.32.187 lmd-technologies.cz www.lmd-technologies.cz" | sudo tee -a /etc/hosts
      - name: Stáhnout web
        run: |
          mkdir site && cd site
          for proto in https http; do
            wget -e robots=off --mirror --page-requisites --adjust-extension --no-parent \
                 --span-hosts --domains=lmd-technologies.cz,www.lmd-technologies.cz \
                 --no-check-certificate --tries=2 --timeout=20 --wait=0.2 \
                 "$proto://www.lmd-technologies.cz/" "$proto://lmd-technologies.cz/" || true
          done
          cd ..
          find site -type f | sed 's#^site/##' | sort > site/_files.txt
          grep -rhoE '(src|href|srcset|url\()=?["'"'"'(]?https?://[^"'"'"' )>]+' site --include=*.html --include=*.css \
            | grep -oE 'https?://[^/"'"'"' )>]+' | sort | uniq -c | sort -rn > site/_external_hosts.txt || true
          du -sh site; wc -l site/_files.txt; cat site/_external_hosts.txt | head -30
      - name: Uložit do větve "stary-web"
        run: |
          cd site
          git init -q -b stary-web
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Kopie starého webu z Webglobe"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" stary-web
